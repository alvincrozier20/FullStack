{% extends 'base.html' %}
{% block body %}
<div class="container">
  <h1 class="text-center">Update Employee Details</h1>
  <form action="/update/{{employee.sno}}" method="POST">
    <div class="mb-3">
  <label for="" class="form-label">Full Name</label>
  <input type="text" class="form-control" name="name" id="" placeholder="Enter full name" value="{{employee.name}}">
</div>
<div class="mb-3">
  <label for="" class="form-label">Email</label>
  <input type="email" class="form-control" name="email" id="" placeholder="Enter email" value="{{employee.email}}">
</div>
<div class="mb-3">
  <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>
</div>
{% endblock body %}
